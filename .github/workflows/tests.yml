name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-cta-smoke-test:
    name: Landing page CTA smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Start Free / Log in are wired up
        run: node scripts/test-landing-cta.mjs
        env:
          BASE_URL: https://stockpilot-ai-ops.vercel.app

  tenant-rls-tests:
    name: Multi-tenant RLS tests
    # Runs after the smoke test so a broken deploy fails fast before this
    # suite creates and deletes real test data in the live Supabase
    # project. Only on PRs, not on every push to main.
    needs: landing-cta-smoke-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run RLS hardening test suite
        run: node scripts/test-tenant-rls.mjs
        env:
          # SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY come from the committed
          # .env (safe to expose client-side). Only the service-role key,
          # which enables cleanup of the users/rows this suite creates,
          # needs to be a repository secret.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  api-v1-tests:
    name: Public API v1 tests
    # Same guard as tenant-rls-tests, and for the same reason (real
    # writes against the live Supabase project).
    needs: landing-cta-smoke-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run API v1 test suite
        # Bun, not node: it resolves this file's `@/...` (tsconfig path
        # alias) imports and runs TypeScript directly, neither of which
        # plain `node scripts/*.mjs` can do -- this suite imports the
        # actual router module (src/lib/api-v1/router.server.ts) instead
        # of making HTTP calls to a deployed instance, so it always
        # tests this PR's own code.
        run: bun run scripts/test-api-v1.ts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build:
    name: Build (typecheck + production build)
    # Nothing gets a chance to become a new (broken) deploy until the fast
    # smoke test has passed first.
    needs: landing-cta-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
